<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PluginDex</title>

    <link
        rel="stylesheet"
        href="diseño/style.css"
    >
</head>

<body>

<div id="app">

    <!-- =========================================
         BARRA SUPERIOR
    ========================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                P
            </div>

            <div>
                <div class="brand-name">
                    PluginDex
                </div>

                <div class="brand-version">
                    WEB ENGINE 1.0
                </div>
            </div>

        </div>


        <div class="top-menu">

            <button
                class="top-button"
                id="newProject"
            >
                NUEVO
            </button>

            <button
                class="top-button"
                id="saveProject"
            >
                GUARDAR
            </button>

            <button
                class="top-button"
                id="loadProject"
            >
                ABRIR
            </button>

            <button
                class="top-button run-button"
                id="runProject"
            >
                ▶ EJECUTAR
            </button>

            <button
                class="top-button"
                id="exportProject"
            >
                EXPORTAR
            </button>

        </div>

    </header>


    <!-- =========================================
         ÁREA PRINCIPAL
    ========================================== -->

    <main class="workspace">


        <!-- =====================================
             PANEL IZQUIERDO
        ====================================== -->

        <aside class="left-panel">

            <div class="panel-title">
                COMPONENTES
            </div>


            <div class="component-list">


                <button
                    class="component-item"
                    data-component="text"
                >

                    <span class="component-icon">
                        T
                    </span>

                    <span>
                        <strong>Texto</strong>
                        <small>Texto normal</small>
                    </span>

                </button>


                <button
                    class="component-item"
                    data-component="button"
                >

                    <span class="component-icon">
                        ▣
                    </span>

                    <span>
                        <strong>Botón</strong>
                        <small>Botón interactivo</small>
                    </span>

                </button>


                <button
                    class="component-item"
                    data-component="box"
                >

                    <span class="component-icon">
                        □
                    </span>

                    <span>
                        <strong>Caja</strong>
                        <small>Contenedor</small>
                    </span>

                </button>


                <button
                    class="component-item"
                    data-component="image"
                >

                    <span class="component-icon">
                        ▧
                    </span>

                    <span>
                        <strong>Imagen</strong>
                        <small>Imagen</small>
                    </span>

                </button>


                <button
                    class="component-item"
                    data-component="title"
                >

                    <span class="component-icon">
                        H
                    </span>

                    <span>
                        <strong>Título</strong>
                        <small>Título grande</small>
                    </span>

                </button>

            </div>


            <!-- =================================
                 BLOQUES
            ================================== -->

            <div class="panel-title logic-title">
                BLOQUES
            </div>


            <div class="logic-list">


                <button
                    class="logic-item yellow"
                    data-block="click"
                >
                    ⚡ AL HACER CLIC
                </button>


                <button
                    class="logic-item blue"
                    data-block="text"
                >
                    T CAMBIAR TEXTO
                </button>


                <button
                    class="logic-item green"
                    data-block="color"
                >
                    ● CAMBIAR COLOR
                </button>


                <button
                    class="logic-item purple"
                    data-block="hide"
                >
                    ◐ MOSTRAR / OCULTAR
                </button>

            </div>

        </aside>


        <!-- =====================================
             EDITOR
        ====================================== -->

        <section class="editor-area">

            <div class="editor-toolbar">

                <span>
                    PROYECTO / PÁGINA
                </span>

                <span id="zoomLabel">
                    100%
                </span>

            </div>


            <div
                id="canvas"
                class="canvas"
            >

                <div
                    id="page"
                    class="page"
                >

                    <div
                        class="pd-element pd-title selected"
                        data-id="element-1"
                        data-type="title"
                    >
                        Mi página
                    </div>


                    <div
                        class="pd-element pd-text"
                        data-id="element-2"
                        data-type="text"
                    >
                        Bienvenido a PluginDex.
                    </div>


                    <button
                        class="pd-element pd-button"
                        data-id="element-3"
                        data-type="button"
                    >
                        Haz clic
                    </button>

                </div>

            </div>

        </section>


        <!-- =====================================
             PANEL DERECHO
        ====================================== -->

        <aside class="right-panel">

            <div class="panel-title">
                PROPIEDADES
            </div>


            <div
                id="properties"
                class="properties"
            >

                <div class="empty-properties">

                    <div class="empty-icon">
                        ◈
                    </div>

                    <strong>
                        Ningún elemento
                    </strong>

                    <span>
                        Selecciona algo en la página.
                    </span>

                </div>

            </div>

        </aside>

    </main>


    <!-- =========================================
         BARRA INFERIOR
    ========================================== -->

    <footer class="statusbar">

        <span id="status">
            ● LISTO
        </span>

        <span>
            PluginDex Engine
        </span>

        <span>
            OFFLINE MODE
        </span>

    </footer>

</div>


<!-- =========================================
     PREVIEW
========================================== -->

<div
    id="previewModal"
    class="modal hidden"
>

    <div class="modal-window preview-window">

        <div class="modal-header">

            <span>
                PluginDex Preview
            </span>

            <button
                class="close-button"
                id="closePreview"
            >
                ×
            </button>

        </div>

        <iframe
            id="previewFrame"
        ></iframe>

    </div>

</div>


<!-- =========================================
     EXPORTACIÓN
========================================== -->

<div
    id="exportModal"
    class="modal hidden"
>

    <div class="modal-window export-window">

        <div class="modal-header">

            <span>
                EXPORTAR PROYECTO
            </span>

            <button
                class="close-button"
                id="closeExport"
            >
                ×
            </button>

        </div>


        <div class="export-body">

            <textarea
                id="exportCode"
                readonly
            ></textarea>

            <button
                id="copyCode"
                class="copy-button"
            >
                COPIAR CÓDIGO
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     SCRIPTS
========================================== -->

<script src="sistema/proyecto.js"></script>
<script src="sistema/almacenamiento.js"></script>
<script src="sistema/engine.js"></script>

<script src="funciones/utilidades.js"></script>
<script src="funciones/elementos.js"></script>
<script src="funciones/exportador.js"></script>

<script src="editor/bloques.js"></script>
<script src="editor/editor.js"></script>

</body>
</html>
